name: ${DEVBOX_NAME:-lance-devbox}

services:
  devbox:
    image: ${DEVBOX_IMAGE:-ghcr.io/westonpace/lance-weston-devbox:latest}
    container_name: ${DEVBOX_NAME:-lance-devbox}
    hostname: ${DEVBOX_NAME:-lance-devbox}
    init: true

    # Host networking is deliberate. lance's integration tests hardcode
    # http://localhost:4566 (rust/lance/src/io/commit/s3_test.rs,
    # python/python/tests/test_s3_ddb.py) and `make integtest` starts
    # LocalStack itself via the mounted Docker socket, which publishes 4566 on
    # the HOST. Sharing the host netns is what makes those two line up.
    # Consequence: boxes share one network stack, so run `make integtest` in
    # one box at a time.
    network_mode: host

    volumes:
      - ${DEVBOX_WORKSPACE:-./workspace}:/workspace
      # Sibling containers (LocalStack), not Docker-in-Docker.
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared across every box: all are safe under concurrent access.
      # Build outputs are not here -- see MBX_TARGET_ROOT below.
      - cargo-registry:/home/lance/.cargo/registry
      - cargo-git:/home/lance/.cargo/git
      - maven:/home/lance/.m2
      - uv-cache:/home/lance/.cache/uv
      # mbx's action store: the compiler outputs every box reuses. Its shim
      # directory is deliberately NOT in here (see MBX_SHIMS_DIR in the image).
      - mbx-cache:/home/lance/.cache/mbx

    environment:
      # Bare names pass through from .env / the shell and are omitted entirely
      # when unset -- cargo rejects an empty CARGO_BUILD_JOBS, so a map entry
      # defaulting to "" would break every build. The same applies to every
      # optional MBX_* below.
      #
      # CARGO_BUILD_JOBS: cap it when several boxes build at once, or rustc
      # link steps race each other for RAM.
      - CARGO_BUILD_JOBS

      # --- rust build cache (mr boxington) ---------------------------------
      # The action store is shared by every box; that is the whole point.
      - MBX_CACHE_DIR=/home/lance/.cache/mbx
      # Managed target directories are keyed by the checkout's path, and every
      # box mounts its checkout at the same /workspace -- so a shared target
      # root would hand two boxes the same directory and let Cargo's lock
      # serialise them. One root per box, on the workspace mount. Keep that
      # mount and Docker's volumes on one filesystem (they both live on /data
      # on the EC2 host) so restores hard-link out of the store instead of
      # copying gigabytes.
      - MBX_TARGET_ROOT=/workspace/.mbx-targets
      # One budget over the store, the managed targets and incremental state.
      - MBX_GC_MAX_TOTAL_SIZE=${MBX_GC_MAX_TOTAL_SIZE:-50GiB}
      # The image makes mold the default linker. Set MBX_LINKER=system to put a
      # box back on GNU ld -- for a bisect against a link-order bug, say. It is
      # part of the cache key for native links, so a box that differs here
      # stops sharing those results with the others.
      - MBX_LINKER

      # Remote cache. Unset -> the box uses its local store only. On EC2 set
      # MBX_REMOTE_URL=s3://bucket/prefix in .env and let the instance role
      # sign the requests; mbx reads IMDSv2 itself, and host networking means
      # the instance's default metadata hop limit is not in the way.
      - MBX_REMOTE_URL
      - MBX_REMOTE_NAMESPACE=${MBX_REMOTE_NAMESPACE:-lance}
      # mbx publishes only from CI on a protected branch unless it is told the
      # environment is trusted. A devbox is a plain shell, so without this it
      # would quietly degrade to read-only and never fill the bucket. Set
      # MBX_REMOTE_MODE=read-only for a box that should only consume.
      - MBX_REMOTE_TRUST_WRITES=${MBX_REMOTE_TRUST_WRITES:-true}
      - MBX_REMOTE_MODE
      - MBX_REMOTE_S3_REGION
      - MBX_REMOTE_S3_ENDPOINT
      - AWS_REGION
      - AWS_EC2_METADATA_DISABLED

    command: ["sleep", "infinity"]
    stop_grace_period: 5s

    # $HOME lives in the container's writable layer, not a volume, so that
    # rebuilding the image genuinely updates the toolchains instead of leaving
    # a stale ~/.rustup behind. Use `devbox stop`/`devbox start` for the daily
    # cycle; `devbox down` is the deliberate "give me a clean home" button.

volumes:
  # Explicit `name:` keeps these outside the compose project namespace so
  # every box shares one copy instead of re-downloading crates per box.
  cargo-registry:
    name: lance-devbox-cargo-registry
  cargo-git:
    name: lance-devbox-cargo-git
  maven:
    name: lance-devbox-maven
  uv-cache:
    name: lance-devbox-uv-cache
  mbx-cache:
    name: lance-devbox-mbx-cache
